[package]
name = "workbuddy-task-assistant"
version = "0.1.23"
description = "WorkBuddy 任务助手"
edition = "2021"

[lib]
name = "task_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 并发查余额用信号量限流；更新轮询要 sleep。Tauri 内部本就跑 tokio，
# 这里只补 feature 不引入第二份运行时。
tokio = { version = "1", features = ["rt", "sync", "time"] }
# tray-icon：关闭窗口后常驻系统托盘
# image-png：托盘菜单用 PNG 图标
# protocol-asset：预留本地图标资源
# webview-data-url：内置空页面兜底
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 导入/导出账号需要系统文件对话框
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 定时调度按本地日期 / 时刻判断（lastRunDate、HH:MM 到点）
chrono = "0.4"
# 自动更新：下载 / 校验 minisign 签名 / 调用 NSIS 覆盖安装，都由官方插件的
# Windows 后端处理（自己拼 installer 命令行会在进程占用时失败）。
# process：安装器启动后需要主动退出当前进程，交给插件做更稳。
tauri-plugin-updater = "2"
# 系统通知：批量跑完/失败时在托盘外也能知道结果
tauri-plugin-notification = "2"
# 窗口大小/位置记忆：每次启动不用重摆
tauri-plugin-window-state = "2"
# 检查更新用：与 core 同版本同 feature，直接复用已编译产物，不增加构建时间。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 直接复用已有工具的核心逻辑（账号库 / 签到 / 成长任务 / 旅行 / 令牌续期），
# 不另起一份网络与存储实现。已 vendored 进 crates/，克隆即可编译（CI 前提）。
wb-switch-core = { path = "../crates/wb-switch-core" }
# 归档任务清理：读写 WorkBuddy 会话库 workbuddy.db。
# 与 core 同版本同 feature（bundled+backup），共享编译产物不增加构建时间。
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# 窗口毛玻璃：Windows acrylic / macOS vibrancy，纯原生效果，关掉即恢复不透明
window-vibrancy = "0.6"
