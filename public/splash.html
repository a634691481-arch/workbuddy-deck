<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WorkBuddy Deck</title>
<style>
  /* 启动动画：2.8s 一次性时间轴。布局全部绝对定位——
     不依赖 flex 高度链，窗口尺寸有偏差也不会把内容顶出可视区。 */
  :root{
    --bg:#08080A; --line:#232329; --fg:#E9E9EC; --muted:#8A8A95;
    --faint:#5A5A66; --hazard:#E1372B; --ready:#8DE04F;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;border-radius:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:var(--mono);-webkit-font-smoothing:antialiased;cursor:default;user-select:none}

  .stage{position:absolute;inset:0;
    background-image:
      linear-gradient(to right,rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:26px 26px;
    animation:fade .3s 2.5s ease-in both}
  @keyframes fade{to{opacity:0}}

  /* 顶部危险红：与主界面标题栏同一条基准线 */
  .topline{position:absolute;left:0;right:0;top:0;height:2px;background:var(--hazard);
    transform-origin:left;animation:line .4s cubic-bezier(.16,1,.3,1) both}
  @keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .sweep{position:absolute;left:0;right:0;top:0;height:80px;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(225,55,43,.09),transparent);
    animation:sweep 1s .1s ease-in both}
  @keyframes sweep{from{transform:translateY(-90px);opacity:0}25%{opacity:1}to{transform:translateY(300px);opacity:0}}

  /* 头部：左上 */
  .head{position:absolute;left:24px;top:26px;display:flex;align-items:center;gap:12px;
    animation:rise .45s .08s cubic-bezier(.16,1,.3,1) both}
  .mark{width:34px;height:34px;border:1px solid var(--hazard);display:grid;place-items:center;
    font-size:13px;letter-spacing:.06em;color:var(--hazard)}
  .wm{font-size:14px;letter-spacing:.2em;text-transform:uppercase;line-height:1.2}
  .wm small{display:block;margin-top:4px;font-size:8.5px;letter-spacing:.2em;color:var(--faint)}

  /* 三行读数：贴底区上方，绝对定位不受内容流影响 */
  .rows{position:absolute;left:24px;right:24px;bottom:76px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;
    height:27px;border-bottom:1px solid var(--line);
    animation:rise .3s cubic-bezier(.16,1,.3,1) both}
  .row:nth-child(1){animation-delay:.42s}
  .row:nth-child(2){animation-delay:.64s}
  .row:nth-child(3){animation-delay:.86s}
  .row span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .row b{font-size:10px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
  .row b i{font-style:normal;color:var(--fg)}
  .row.done b{color:var(--ready)}

  /* 进度格 */
  .bar{position:absolute;left:24px;right:24px;bottom:56px;display:flex;gap:2px;height:5px}
  .bar u{flex:1;background:var(--line);overflow:hidden;position:relative}
  .bar u::after{content:"";position:absolute;inset:0;background:var(--hazard);
    transform:scaleX(0);transform-origin:left;animation:fill .1s linear both}
  @keyframes fill{to{transform:scaleX(1)}}

  /* 底部读数行 */
  .foot{position:absolute;left:24px;right:24px;bottom:24px;display:flex;
    align-items:center;justify-content:space-between;
    font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    animation:rise .35s 1.5s cubic-bezier(.16,1,.3,1) both}
  .foot .st{display:flex;align-items:center;gap:6px;color:var(--ready)}
  .foot .st::before{content:"";width:5px;height:5px;background:var(--ready);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.15}}

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01s!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="topline"></div>
  <div class="sweep"></div>

  <div class="head">
    <div class="mark">WD</div>
    <div class="wm">WorkBuddy Deck<small>multi-account console</small></div>
  </div>

  <div class="rows">
    <div class="row"><span>account slot</span><b><i id="acct">00</i> / 06</b></div>
    <div class="row"><span>quota snapshot</span><b id="quota">reading</b></div>
    <div class="row done"><span>rate limit ledger</span><b>ready</b></div>
  </div>

  <div class="bar" id="bar"></div>

  <div class="foot">
    <span>rev 0.1.1</span>
    <span class="st">initialising</span>
  </div>
</div>

<script>
  // 24 段进度格：纯视觉节奏，不代表真实加载进度。
  const bar = document.getElementById('bar');
  const SEG = 24;
  for (let i = 0; i < SEG; i++) {
    const u = document.createElement('u');
    u.style.setProperty('animation-delay', (0.3 + i * 0.055).toFixed(3) + 's');
    bar.appendChild(u);
  }

  // 两处读数：数到 6 之后转 ready，让「读完了」有落点。
  const acct = document.getElementById('acct');
  const quota = document.getElementById('quota');
  const st = document.querySelector('.foot .st');
  let n = 0;
  const tick = setInterval(() => {
    n = Math.min(6, n + 1);
    acct.textContent = String(n).padStart(2, '0');
    if (n === 6) {
      clearInterval(tick);
      quota.textContent = 'synced';
      st.textContent = 'ready';
    }
  }, 230);

  // 动画播完（2.5s 起淡出）后通知后端切主窗口。
  // 用页面时钟而不是窗口创建时刻：WebView2 冷启动会晚 0.6~1.5s，
  // 后端若按创建时刻定时，会把动画切在半截。
  let told = false;
  function handoff() {
    if (told) return;
    told = true;
    try { window.__TAURI__?.core?.invoke("splash_done"); } catch (_) {}
  }
  setTimeout(handoff, 2560);
  setTimeout(handoff, 4000); // 兜底：动画被系统降级/掉帧时也要能收尾
</script>
</body>
</html>
