name: release

# 打 tag 即发版：三平台并行构建 → 各自签名 → 合并 latest.json → 建 Release。
# 客户端读 releases/latest/download/latest.json，所以必须是「正式版」（非 draft/prerelease）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的版本号（如 v0.1.1）"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: macos-latest
            bundles: app,dmg
          # Intel Mac 单独跑：latest.json 的 darwin-x86_64 条目必须有产出
          - os: macos-13
            bundles: app,dmg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # vendored core 编译慢（rusqlite bundled + windows crate），缓存能省 10 分钟以上
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # 每个平台只发自己的资产；latest.json 由 tauri-action 合并平台条目
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "WorkBuddy Deck ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            Windows / Linux / macOS 安装包与 `latest.json` 由 CI 产出，应用内「系统设置 → 自动更新」会发现本版本。
            `.sig` 用于客户端校验，请勿单独分发安装包。
            macOS 未签名，首次打开需右键 → 打开。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

  # 闸门：所有平台构建完再验一次 latest.json，缺了就让整条流水线红。
  # 曾在中文 productName 时静默跳过（GitHub 换掉非 ASCII 文件名，.sig 对不上）。
  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Verify updater manifest is published
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          url="https://github.com/$REPO/releases/download/$TAG/latest.json"
          for i in $(seq 1 10); do
            if body=$(curl -fsSL "$url"); then
              echo "$body" | head -c 400
              echo "$body" | grep -q '"version"' || { echo "manifest has no version"; exit 1; }
              echo "latest.json ok: $url"
              exit 0
            fi
            sleep 6
          done
          echo "latest.json missing for $TAG — updater chain is broken"
          exit 1
