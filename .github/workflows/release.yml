name: release

# 打 tag 即发版：构建 NSIS 安装包 → 用私钥签名 → 生成 latest.json → 建 Release。
# 客户端读 releases/latest/download/latest.json，所以发布必须是「正式版」（非 draft/prerelease）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的版本号（如 v0.1.1）"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # vendored core 编译慢（rusqlite bundled + windows crate），缓存能省 10 分钟以上
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "WorkBuddy Deck ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            Windows 安装包（NSIS）与 `latest.json` 由 CI 产出；应用内「系统设置 → 自动更新」会自动发现本版本。
            安装包的 `.sig` 签名用于客户端校验，不要单独分发 exe。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      # 闸门：没有 latest.json，客户端就查不到更新。
      # 曾在中文 productName 时静默跳过（GitHub 把非 ASCII 文件名换掉，.sig 对不上），
      # 所以这里必须显式验证，不能让「构建成功但更新链断」蒙混过去。
      - name: Verify updater manifest is published
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/latest.json"
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $body = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              if ($body.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 6 }
          }
          if (-not $ok) { throw "latest.json missing for $env:TAG — updater chain is broken" }
          Write-Output "latest.json ok: $url"
