name: release

# 打 tag 即发版：三平台并行构建 → 各自签名 → 合并 latest.json → 建 Release。
# 客户端读 releases/latest/download/latest.json，所以必须是「正式版」（非 draft/prerelease）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的版本号（如 v0.1.1）"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: macos-latest
            bundles: app,dmg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # vendored core 编译慢（rusqlite bundled + windows crate），缓存能省 10 分钟以上
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # 每个平台只发自己的资产；latest.json 由 tauri-action 合并平台条目
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "WorkBuddy Deck ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          releaseBody: |
            Windows / Linux / macOS 安装包与 `latest.json` 由 CI 产出，应用内「系统设置 → 自动更新」会发现本版本。
            `.sig` 用于客户端校验，请勿单独分发安装包。
            macOS 仅提供 Apple Silicon（aarch64）安装包，未签名，首次打开需右键 → 打开。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

      # 免安装版：Windows 只有一个裸 exe 可直接跑（Win10/11 自带 WebView2），
      # 打成 zip 挂到同一个 Release。Linux 的 AppImage、macOS 的 .app.tar.gz 本身就免安装。
      - name: Package portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri/target/release/workbuddy-task-assistant.exe" "portable/WorkBuddyDeck.exe"
          @"
          WorkBuddy Deck v$ver - 免安装版
          ================================
          双击 WorkBuddyDeck.exe 即可运行，不写注册表、不建开始菜单。
          数据仍存在 %USERPROFILE%\.wb-switch，与安装版共用；卸载安装版不会删数据。
          前置：Windows 10/11 自带 WebView2 运行时（缺了系统会提示安装）。

          注意：免安装版不支持自动更新，升级请重新下载 zip。
          "@ | Set-Content -Encoding UTF8 portable/README.txt
          $zip = "WorkBuddy.Deck_${ver}_x64-portable.zip"
          Compress-Archive -Path "portable/*" -DestinationPath $zip -Force
          Write-Output "uploading $zip"
          gh release upload $env:TAG $zip --clobber

  # 不再单独打 Intel Mac：那条 job 单跑 10.7 分钟，比其余三个平台（均 4 分钟）加起来还慢，
  # 而它只产一个 x64.dmg。macOS 现在只发 Apple Silicon，Intel 机型不再提供安装包。
  # 要恢复时把下面这段 git 历史里的 build-intel-mac 拷回来即可（tag 见 git log releases 前版本）。

  # 闸门：所有平台构建完再验一次 latest.json，缺了就让整条流水线红。
  # 曾在中文 productName 时静默跳过（GitHub 换掉非 ASCII 文件名，.sig 对不上）。
  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Verify updater manifest is published
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          url="https://github.com/$REPO/releases/download/$TAG/latest.json"
          for i in $(seq 1 10); do
            if body=$(curl -fsSL "$url"); then
              echo "$body" | head -c 400
              echo "$body" | grep -q '"version"' || { echo "manifest has no version"; exit 1; }
              echo "latest.json ok: $url"
              exit 0
            fi
            sleep 6
          done
          echo "latest.json missing for $TAG — updater chain is broken"
          exit 1

      # 国内镜像清单：安装包地址统一换成 gh-proxy 前缀，客户端默认走它。
      # 官方 latest.json 不动，境外用户拿到的仍是直连地址。
      # 用仓库里的脚本生成：YAML 块里写 heredoc 会因结束符不能顶格而失败。
      - name: Publish CN mirror manifest
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL "https://github.com/$REPO/releases/download/$TAG/latest.json" -o latest.json
          python3 scripts/gen_cn_manifest.py latest.json latest-cn.json
          head -c 300 latest-cn.json; echo
          gh release upload "$TAG" latest-cn.json --clobber
          echo "latest-cn.json uploaded"
