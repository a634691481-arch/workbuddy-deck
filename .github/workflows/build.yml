name: build

# 每次 push 到 main 都自动构建三平台产物，挂在 Artifact 里（不发 Release）。
# 为什么不直接发 Release：版本号没变就重发会让「latest 指向谁」变得不可解释。
# Release 只由 tag 触发（见 release.yml）。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            # 只收安装包与签名，别把 .app / target 目录塞进 artifact
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.sig
              WorkBuddy.Deck_*_x64-portable.zip
            artifact: windows
          - os: ubuntu-22.04
            bundles: appimage,deb
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.sig
            artifact: linux
          - os: macos-latest
            bundles: app,dmg
            paths: |
              src-tauri/target/release/bundle/macos/*.tar.gz
              src-tauri/target/release/bundle/macos/*.sig
              src-tauri/target/release/bundle/dmg/*.dmg
            artifact: macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      # Linux 打包依赖：webkit2gtk 4.1（Tauri 2 要求）+ appindicator（托盘）
      - name: Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # 主分支 / 手动：出正式包（需要私钥签名）
      - name: Build bundles
        if: github.event_name != 'pull_request'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # PR（含 fork）：不打包不签名，只验证能编译出二进制
      - name: Build binary only (PR)
        if: github.event_name == 'pull_request'
        run: npm run tauri build -- --no-bundle

      # 免安装版：裸 exe 打成 zip（数据仍走 ~/.wb-switch，与安装版共用）
      - name: Package portable zip (Windows)
        if: matrix.os == 'windows-latest' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri/target/release/workbuddy-task-assistant.exe" "portable/WorkBuddyDeck.exe"
          "WorkBuddy Deck v$ver - 免安装版：双击 WorkBuddyDeck.exe 运行；数据仍在 %USERPROFILE%\.wb-switch。" |
            Set-Content -Encoding UTF8 portable/README.txt
          Compress-Archive -Path "portable/*" -DestinationPath "WorkBuddy.Deck_${ver}_x64-portable.zip" -Force

      - name: Upload ${{ matrix.artifact }}
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-deck-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
